# Foto-Website auf dem Hetzner-Server, liegt dort in ~/fotos-web/ zusammen mit .env (Vorlage: env.example).
# Läuft neben dem Portal (~/unihockey) und Immich (~/fotos). Das HTTPS übernimmt der Caddy des Portals,
# der diese Seite über das Netzwerk "web" erreicht (deploy.sh trägt die Domain dort ein).
name: fotos-web

services:
  # Der Dienst heisst bewusst nicht "web": im Netzwerk "web" liegt sonst ein Namenskonflikt mit dem Portal
  fotos-web:
    image: ${IMAGE:-ghcr.io/floorba11/fotos-web:latest}
    container_name: fotos_web
    restart: unless-stopped
    environment:
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:?IMMICH_API_KEY fehlt in .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Passwort für /statistik (Aufrufe und Downloads pro Album); leer = Seite abgeschaltet
      STATS_PASSWORD: ${STATS_PASSWORD:-}
    volumes:
      # Kaderporträts (Dateien "Vorname Nachname.jpg") im Ordner _Portraits der Storage Box, nur lesend.
      # In Immich muss dieser Ordner unter Bibliothek → Ausschlussmuster stehen: **/_Portraits/**
      # Fehlt er, startet der Container nicht, statt still ohne Porträts zu laufen.
      - type: bind
        source: ${PORTRAITS_SOURCE:-/mnt/fotos/_Portraits}
        target: /portraits
        read_only: true
        bind:
          create_host_path: false
      # Zähler für Aufrufe und Downloads pro Album (nur Zahlen, keine Personendaten); bleibt bei Updates erhalten
      - stats:/data
    networks: [web]
    mem_limit: 256m

volumes:
  stats:

networks:
  web:
    external: true
