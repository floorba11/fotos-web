# Bei jedem Push auf main: Image bauen, nach ghcr.io schieben und auf dem Hetzner-Server starten.
# Der Deploy-Schritt läuft nur, wenn die Secrets VM_HOST, VM_USER und VM_SSH_KEY gesetzt sind (dieselben wie beim Portal).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/floorba11/fotos-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH-Zugang vorbereiten
        if: env.VM_HOST != ''
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if printf '%s' "$VM_SSH_KEY" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/id_vm
          else
            printf '%s' "$VM_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_vm
          fi
          chmod 600 ~/.ssh/id_vm
          ssh-keygen -y -f ~/.ssh/id_vm > /dev/null || { echo "VM_SSH_KEY ist kein gültiger privater Schlüssel"; exit 1; }
          cat >> ~/.ssh/config <<EOT
          Host vm
            HostName $VM_HOST
            User $VM_USER
            IdentityFile ~/.ssh/id_vm
            StrictHostKeyChecking accept-new
          EOT

      - name: Konfiguration auf den Server kopieren
        if: env.VM_HOST != ''
        run: |
          ssh vm 'mkdir -p ~/fotos-web'
          scp docker-compose.yml env.example deploy.sh vm:fotos-web/

      - name: Neues Image auf dem Server starten
        if: env.VM_HOST != ''
        run: |
          # Das GITHUB_TOKEN gilt nur während dieses Laufs – reicht für den Pull, danach wieder abmelden
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vm 'docker login ghcr.io -u ${{ github.actor }} --password-stdin'
          # Ohne ~/fotos-web/.env (erster Lauf) wird nur kopiert
          ssh vm 'cd ~/fotos-web && if [ -f .env ]; then docker compose pull && bash deploy.sh; else echo ".env fehlt – nur Dateien kopiert"; fi; \
            status=$?; docker logout ghcr.io >/dev/null; docker image prune -f >/dev/null; exit $status'
